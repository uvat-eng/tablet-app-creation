name: Сборка для App Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Номер сборки
        required: true
        default: '58'
      upload:
        description: Отправить в App Store
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собираем веб-часть
        run: |
          npm install
          npm run build

      - name: Готовим iOS-проект
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Ключ App Store Connect
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          cp ~/private_keys/AuthKey_$KEY_ID.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

          echo "=== ПРОВЕРКА КЛЮЧЕЙ ==="
          echo "Размер ключа: $(wc -c < ~/private_keys/AuthKey_$KEY_ID.p8) символов"
          echo "Строк в ключе: $(wc -l < ~/private_keys/AuthKey_$KEY_ID.p8)"
          head -1 ~/private_keys/AuthKey_$KEY_ID.p8
          tail -1 ~/private_keys/AuthKey_$KEY_ID.p8
          echo "Длина KEY_ID: ${#KEY_ID} (нужно 10)"
          echo "Длина ISSUER_ID: ${#ISSUER_ID} (нужно 36)"
          echo "Длина TEAM_ID: ${#TEAM_ID} (нужно 10)"

          if ! openssl pkey -in ~/private_keys/AuthKey_$KEY_ID.p8 -noout 2>/dev/null; then
            echo "::error::Ключ .p8 повреждён или вставлен не полностью"
            exit 1
          fi
          echo "Ключ корректный"

      - name: Проверяем доступ к Apple
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --list-apps --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee /tmp/apple.log | head -40 || true
          if grep -qi "unable to authenticate\|forbidden\|not authorized\|credentials are missing" /tmp/apple.log; then
            echo "::error::Apple отклонила ключ. Проверьте KEY_ID, ISSUER_ID и роль ключа (нужна App Manager или Admin)"
            exit 1
          fi
          echo "Связь с Apple установлена"

      - name: Номер версии сборки
        run: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" App.xcodeproj/project.pbxproj

      - name: Настройки выгрузки
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Архивируем приложение
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath /tmp/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic 
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      - name: Делаем файл приложения
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath /tmp/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la /tmp/export

      - uses: actions/upload-artifact@v4
        with:
          name: malyshenskoe-ios
          path: /tmp/export/*.ipa
          retention-days: 30

      - name: Отправляем в App Store
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA=$(ls /tmp/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Готово — сборка появится в App Store Connect через 10-30 минут"
